# The game-room server. Deployed on its own (npm run deploy:api) and reached only through the
# Pages site's service binding, so it gets no workers.dev address.
name = "inkduel-rooms"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the kind the free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
